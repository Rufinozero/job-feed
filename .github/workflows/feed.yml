name: job-feed

on:
  schedule:
    # GitHub delays scheduled runs (hours at peak); run well before the skill (08:41 / 17:41 BRT)
    # and off the top of the hour, when the queue is longest.
    - cron: "10 8 * * *"   # 05:10 America/Sao_Paulo
    - cron: "40 15 * * *"  # 12:40 America/Sao_Paulo
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites (comma separated)"
        required: false
        default: "linkedin,indeed"

permissions:
  contents: write

concurrency:
  group: job-feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - run: uv run app
        env:
          LOG_LEVEL: INFO
          # Glassdoor blocks GitHub runners (HTTP 403); it runs from the PC (scripts/run-local.ps1).
          SITES: ${{ inputs.sites || 'linkedin,indeed' }}
      - name: Commit output
        run: |
          git config user.name "job-feed-bot"
          git config user.email "job-feed-bot@users.noreply.github.com"
          git add output/vagas.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(data): update vagas.json"
          git pull --rebase
          git push
