name: job-feed

on:
  schedule:
    - cron: "30 10 * * *"  # 07:30 America/Sao_Paulo
    - cron: "30 18 * * *"  # 15:30 America/Sao_Paulo
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites (comma separated)"
        required: false
        default: "linkedin,indeed"

permissions:
  contents: write

concurrency:
  group: job-feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - run: uv run app
        env:
          LOG_LEVEL: INFO
          # Glassdoor blocks GitHub runners (HTTP 403); it runs from the PC (scripts/run-local.ps1).
          SITES: ${{ inputs.sites || 'linkedin,indeed' }}
      - name: Commit output
        run: |
          git config user.name "job-feed-bot"
          git config user.email "job-feed-bot@users.noreply.github.com"
          git add output/vagas.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(data): update vagas.json"
          git pull --rebase
          git push
