[project]
name = "job-feed"
version = "0.1.0"
description = "Coleta vagas do LinkedIn, Glassdoor e Indeed (JobSpy) para a skill ai-headhunter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "python-jobspy>=1.1.80",
    "requests>=2.31",
]

[project.scripts]
app = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
